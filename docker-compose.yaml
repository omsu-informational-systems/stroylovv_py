services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: breakout-strategy:latest
    container_name: breakout_strategy
    restart: unless-stopped
    ports:
      - "${APP__PORT:-8000}:8000"
    env_file:
      - .env
    networks:
      - breakout_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  breakout_net:
    driver: bridge
